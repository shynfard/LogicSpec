# GitLab CI for LogicSpec.
#
# Pipeline shape:
#   test    → core gate (typecheck, lint, tests, build, CLI smoke) + integrations
#   build   → on release tags: build the VS Code .vsix and the Obsidian plugin as artifacts
#   publish → on release tags, MANUAL: npm publish + VS Code Marketplace publish
#
# Release flow: bump package.json version + CHANGELOG, tag `vX.Y.Z`, push the tag,
# then trigger the manual publish jobs from the pipeline. Nothing publishes
# without a human clicking the job.
#
# Required CI/CD variables (Settings → CI/CD → Variables, masked + protected):
#   NPM_TOKEN  — npm automation token with publish rights (the `logicspec` name
#                was unclaimed as of 2026-08-10; first publish claims it)
#   VSCE_PAT   — Azure DevOps PAT for the VS Code Marketplace publisher that
#                matches `publisher` in integrations/vscode/package.json
#                (the publisher account must be created once, manually)
#   OVSX_PAT   — optional, for Open VSX (publish-openvsx job)

stages:
  - test
  - build
  - publish

default:
  image: node:24
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

.release-tag: &release-tag
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'

core:
  stage: test
  script:
    - npm ci
    - npm run typecheck
    - npm run lint
    - npm run build
    - npm test
    - node dist/cli/main.js validate examples/booking
    - node dist/cli/main.js render examples/booking/booking.feature.yaml --output /tmp/ls-ci
    - node dist/cli/main.js graph examples/booking --output /tmp/ls-ci
    - node dist/cli/main.js inspect examples/booking/booking.feature.yaml --json > /dev/null

core-node20:
  stage: test
  image: node:20
  script:
    - npm ci
    - npm run typecheck
    - npm run build
    - npm test

integrations:
  stage: test
  script:
    # Integrations bundle the core FROM SOURCE (../../src); its yaml/zod
    # imports resolve against the root node_modules — install it first. The
    # VS Code extension's build also copies the built dashboard client from
    # dist/server/public, so the root build must run before it.
    - npm ci
    - npm run build
    - cd integrations/vscode && npm ci && npm run typecheck && npm run build && npm test && cd ../..
    - cd integrations/editor && npm ci && npm run typecheck && npm run build && npm test && cd ../..
    - cd integrations/obsidian && npm ci && npm run typecheck && npm run build && npm test && cd ../..

# ── Release artifacts (tags only) ────────────────────────────────────────────

vsix:
  stage: build
  <<: *release-tag
  needs: [core, integrations]
  script:
    - npm ci
    - npm run build
    - cd integrations/vscode
    - npm ci
    - npm run build
    # --no-dependencies: the extension bundles everything via esbuild.
    - npx --yes @vscode/vsce package --no-dependencies -o logicspec-vscode-$CI_COMMIT_TAG.vsix
  artifacts:
    paths:
      - integrations/vscode/*.vsix
    expire_in: 90 days

obsidian-plugin:
  stage: build
  <<: *release-tag
  needs: [core, integrations]
  script:
    - npm ci
    - cd integrations/obsidian
    - npm ci
    - npm run build
  artifacts:
    name: "logicspec-obsidian-$CI_COMMIT_TAG"
    paths:
      - integrations/obsidian/dist/
    expire_in: 90 days

# ── Publishing (tags only, manual) ───────────────────────────────────────────

publish-npm:
  stage: publish
  <<: *release-tag
  needs: [core, integrations]
  when: manual
  script:
    # Guard: the tag must match the package version being published.
    - node -e "const v=require('./package.json').version; if ('v'+v !== process.env.CI_COMMIT_TAG) { console.error('Tag '+process.env.CI_COMMIT_TAG+' does not match package.json version '+v); process.exit(1); }"
    - npm ci
    - npm run typecheck
    - npm run lint
    - npm run build
    - npm test
    - echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
    # prepack builds dist; publishes exactly the `files` allowlist.
    - npm publish --access public
  environment:
    name: npm

publish-vscode:
  stage: publish
  <<: *release-tag
  needs: [vsix]
  when: manual
  script:
    - npx --yes @vscode/vsce publish --packagePath integrations/vscode/*.vsix -p "$VSCE_PAT"
  environment:
    name: vscode-marketplace

# Open VSX mirrors the marketplace for VSCodium/Gitpod users. Optional.
publish-openvsx:
  stage: publish
  <<: *release-tag
  needs: [vsix]
  when: manual
  allow_failure: true
  script:
    - npx --yes ovsx publish integrations/vscode/*.vsix -p "$OVSX_PAT"
  environment:
    name: open-vsx
