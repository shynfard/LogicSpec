# yaml-language-server: $schema=../../schemas/feature.schema.json
version: "1"

feature:
  id: reminder
  name: Reminder
  description: Sends a reminder built from shared definitions ($ref reuse).

start: home

actors:

  web:
    kind: frontend
    label: Web App

  # A shared actor pulled in by reference. Like step templates, an actor $ref may
  # carry local override keys that shallow-merge over the resolved actor (local
  # wins) — here the label is customized for this feature. The merged actor is
  # still validated against the strict actor schema.
  notifier:
    $ref: "definitions#/actors/notifier"
    label: Reminder Notifier

steps:

  home:
    type: page
    label: Home
    actor: web
    actions:
      send:
        label: Send reminder
        next: notify

  # A shared step template pulled in by reference. The map key ("notify") is the
  # step id; the local keys shallow-merge over the template (local wins), so this
  # overrides the template's label and supplies the transition the template left
  # to the caller.
  notify:
    $ref: "definitions#/steps/send-notification"
    label: Send Reminder
    next: sent

  sent:
    type: final
    label: Reminder Sent
    outcome: success
