# yaml-language-server: $schema=../../../../schema/logicspec-0.1.schema.json
logicSpec: "0.1"

kind: service

module: booking

service:
  id: booking-service
  name: Booking Service
  description: >
    Owns availability, reservations and the booking lifecycle.

  operations:
    list-services:
      description: Return bookable salon services.
      http:
        method: GET
        path: /services
      output:
        services: ServiceList
      errors: [service-unavailable]

    list-staff:
      description: Return staff members offering a service.
      http:
        method: GET
        path: /staff
      input:
        service: Service
      output:
        staff: StaffList

    list-bookings:
      description: Return the customer's existing bookings.
      http:
        method: GET
        path: /bookings
      output:
        bookings: BookingList

    check-availability:
      description: Return available slots for a service and staff member.
      http:
        method: GET
        path: /slots
      input:
        service: Service
        staff: Staff
      output:
        slots: SlotList
      errors: [no-slots]

    reserve-slot:
      description: Temporarily reserve a time slot during checkout.
      http:
        method: POST
        path: /reservations
      input:
        slot: Slot
      output:
        reservation: Reservation
      errors: [slot-conflict]

    release-reservation:
      description: Release a held slot that will not be booked.
      http:
        method: DELETE
        path: /reservations
      input:
        reservation: Reservation

    create-booking:
      description: Turn a paid reservation into a confirmed booking.
      http:
        method: POST
        path: /bookings
      input:
        reservation: Reservation
      output:
        booking: Booking

    cancel-booking:
      description: Cancel an existing booking.
      http:
        method: POST
        path: /booking-cancellations
      input:
        booking: Booking
