# yaml-language-server: $schema=../../../../schema/logicspec-0.1.schema.json
logicSpec: "0.1"

kind: feature

module: notification

feature:
  id: notify-on-booking
  name: Notify On Booking
  description: >
    Sends the customer a confirmation message whenever a booking is created.
  actors: [system]

  context:
    bookingId: string

  start: await-booking

  steps:
    await-booking:
      type: wait
      event: BookingCreated
      into:
        bookingId: bookingId
      next: send-confirmation

    send-confirmation:
      type: operation
      call: notification-service.send-confirmation
      with:
        bookingId: bookingId
      on-success: done

    done:
      type: outcome
      result: success
