# yaml-language-server: $schema=../../../../../schema/logicspec-0.1.schema.json
logicSpec: "0.1"

kind: feature

module: payment

feature:
  id: process-payment
  name: Process Payment
  description: >
    Reacts to a payment request from another module, charges the customer,
    and reports completion. The PaymentCompleted event is published by the
    payment service operation itself.
  actors: [system]

  context:
    bookingRef: string
    amount: Money
    receipt: Receipt

  start: await-request

  steps:
    await-request:
      type: wait
      event: PaymentRequested
      into:
        bookingRef: bookingRef
        amount: amount
      next: charge

    charge:
      type: operation
      call: payment-service.process-payment
      with:
        bookingRef: bookingRef
        amount: amount
      into:
        receipt: receipt
      on-success: done
      on-error:
        payment-failed: announce-failure

    announce-failure:
      type: publish
      description: Tell the requesting module the payment did not go through.
      event: PaymentFailed
      with:
        bookingRef: bookingRef
      next: failed

    done:
      type: outcome
      result: success

    failed:
      type: outcome
      result: failure
