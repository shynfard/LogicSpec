# yaml-language-server: $schema=../../../../../schema/logicspec-0.1.schema.json
logicSpec: "0.1"

kind: feature

module: booking

feature:
  id: cancel-booking
  name: Cancel Booking
  description: >
    A customer cancels an existing booking. Refund eligibility depends
    on how far in advance the cancellation happens.
  actors: [customer]

  context:
    booking: Booking

  start: select-booking

  steps:
    select-booking:
      type: page
      description: Customer picks the booking to cancel.
      actions:
        next: confirm-cancel
        keep: kept

    confirm-cancel:
      type: decision
      when: booking starts more than 24 hours from now
      branches:
        refundable: cancel-with-refund
        non-refundable: cancel-without-refund

    cancel-with-refund:
      type: operation
      call: booking-service.cancel-booking
      on-success: announce

    cancel-without-refund:
      type: operation
      call: booking-service.cancel-booking
      on-success: announce

    announce:
      type: publish
      event: BookingCancelled
      next: success

    success:
      type: outcome
      result: success

    kept:
      type: outcome
      result: cancelled
