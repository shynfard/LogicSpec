# yaml-language-server: $schema=../../schema/logicspec-0.1.schema.json
logicSpec: "0.1"

kind: workspace

workspace:
  id: salon-platform
  name: Salon Platform
  description: >
    Example workspace demonstrating LogicSpec 0.1. Documents are deliberately
    spread across domains/, backend/ and contracts/ to show that physical
    location never determines identity.

discovery:
  include:
    - "**/*.logic.yaml"
  exclude:
    - "node_modules/**"
    - ".git/**"
    - "dist/**"
    - "build/**"
