# yaml-language-server: $schema=../../schemas/services.schema.json
version: "1"

services:

  booking:
    name: Booking Service
    operations:

      get-availability:
        kind: http
        method: GET
        path: /availability
        openapi:
          document: ./openapi.yaml
          operationId: getAvailability

      reserve-slot:
        kind: http
        method: POST
        path: /reservations
        openapi:
          document: ./openapi.yaml
          operationId: reserveSlot

      create-booking:
        kind: http
        method: POST
        path: /bookings
        openapi:
          document: ./openapi.yaml
          operationId: createBooking

      cancel-reservation:
        kind: http
        method: DELETE
        path: /reservations
        openapi:
          document: ./openapi.yaml
          operationId: cancelReservation

  payment:
    name: Payment Service
    operations:

      create-payment:
        kind: http
        method: POST
        path: /payments
        openapi:
          document: ./openapi.yaml
          operationId: createPayment

  notification:
    name: Notification Service
    operations:

      send-confirmation:
        kind: http
        method: POST
        path: /notifications
        openapi:
          document: ./openapi.yaml
          operationId: sendConfirmation
