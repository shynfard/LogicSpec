name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 24.x]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: CLI smoke — validate booking example
        run: node dist/cli/main.js validate examples/booking/booking.feature.yaml

      - name: CLI smoke — render booking example
        run: node dist/cli/main.js render examples/booking/booking.feature.yaml --output /tmp/ls-ci
