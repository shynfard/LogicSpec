# Manual, human-triggered publishing from GitHub (mirrors the GitLab pipeline).
#
# Run from the Actions tab ("Release" → Run workflow) on the tag you want to
# ship. Requires the NPM_TOKEN repository secret. The npm publish carries
# provenance (GitHub OIDC), linking the package to this repo and run.
name: Release

on:
  workflow_dispatch:
    inputs:
      target:
        description: What to publish
        required: true
        default: npm
        type: choice
        options:
          - npm
          - vsix-artifact
          - github-release
          - vscode-marketplace

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish-npm:
    if: inputs.target == 'npm'
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Guard — ref must be a release tag matching package.json
        run: |
          node -e "
            const v = require('./package.json').version;
            const ref = process.env.GITHUB_REF;
            if (ref !== 'refs/tags/v' + v) {
              console.error('Run this workflow on tag v' + v + ' (got ' + ref + ').');
              process.exit(1);
            }"

      - name: Install
        run: npm ci

      - name: Full gate
        run: |
          npm run typecheck
          npm run lint
          npm run build
          npm test

      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  vsix-artifact:
    if: inputs.target == 'vsix-artifact'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Core install (source-aliased deps)
        run: npm ci

      - name: Core build
        run: npm run build

      - name: Build .vsix
        working-directory: integrations/vscode
        run: |
          npm ci
          npm run build
          npx --yes @vscode/vsce package --no-dependencies -o logicspec-vscode.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: logicspec-vscode-vsix
          path: integrations/vscode/*.vsix
          retention-days: 90

  # Publishes the extension to the VS Code Marketplace under the publisher
  # configured in integrations/vscode/package.json. Requires the VSCE_PAT
  # repository secret (Azure DevOps PAT, Marketplace → Manage, all orgs).
  publish-vscode:
    if: inputs.target == 'vscode-marketplace'
    runs-on: ubuntu-latest
    environment: vscode-marketplace
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Guard — run this on a vX.Y.Z release tag
        run: |
          if ! printf '%s' "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || \
             [ "$GITHUB_REF" != "refs/tags/$GITHUB_REF_NAME" ]; then
            echo "Pick a vX.Y.Z tag in 'Use workflow from' when dispatching (got $GITHUB_REF)."
            exit 1
          fi

      - name: Core install (source-aliased deps)
        run: npm ci

      - name: Core build
        run: npm run build

      - name: Build, package and publish
        working-directory: integrations/vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          npm ci
          npm run typecheck
          npm run build
          npm test
          npx --yes @vscode/vsce publish --no-dependencies -p "$VSCE_PAT"

  # No-marketplace distribution: attach the VS Code .vsix ("Install from
  # VSIX…") and the Obsidian plugin folder to a GitHub Release for the tag.
  github-release:
    if: inputs.target == 'github-release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Guard — run this on a vX.Y.Z release tag
        run: |
          if ! printf '%s' "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || \
             [ "$GITHUB_REF" != "refs/tags/$GITHUB_REF_NAME" ]; then
            echo "Pick a vX.Y.Z tag in 'Use workflow from' when dispatching (got $GITHUB_REF)."
            exit 1
          fi
          echo "releasing $GITHUB_REF_NAME"

      - name: Core install (source-aliased deps)
        run: npm ci

      - name: Core build
        run: npm run build

      - name: Build .vsix
        working-directory: integrations/vscode
        run: |
          npm ci
          npm run build
          npx --yes @vscode/vsce package --no-dependencies -o "logicspec-vscode-$GITHUB_REF_NAME.vsix"

      - name: Build Obsidian plugin
        working-directory: integrations/obsidian
        run: |
          npm ci
          npm run build
          cd dist && zip -r "../logicspec-obsidian-$GITHUB_REF_NAME.zip" .

      - name: Create or update the release with assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSETS="integrations/vscode/logicspec-vscode-$GITHUB_REF_NAME.vsix integrations/obsidian/logicspec-obsidian-$GITHUB_REF_NAME.zip"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" $ASSETS --clobber
          else
            gh release create "$GITHUB_REF_NAME" $ASSETS --verify-tag --generate-notes
          fi
